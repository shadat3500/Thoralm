services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moveitz
      POSTGRES_PASSWORD: moveitz
      POSTGRES_DB: moveitz
    ports:
      - "5434:5432"
    volumes:
      - moveitz_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moveitz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - moveitz_redis:/data

volumes:
  moveitz_pg:
  moveitz_redis:
